<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<title>For my Euanne</title>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="card">

    <h1 class="title">
        For my Euanne.
    </h1>

    <img
        src="Flowers.jpg"
        id="flower"
        class="flower"
        onclick="tapFlower()"
        alt="Flower Bouquet"
    >

    <p id="tapText" class="tapText">
        Touch the flower 🌸 (0/3)
    </p>

</div>

<!-- PAGE 2 -->
<div id="page2" class="card" style="display:none;">

    <h1 class="title smallTitle">
        May I ask something?
    </h1>

    <div class="buttonRow">

        <button
            class="yesBtn"
            onclick="goPage3()">
            Yes
        </button>

        <button
            id="noBtn"
            class="noBtn"
            onclick="pressNo()">
            No
        </button>

    </div>

    <p id="sadText" class="message"></p>

</div>

<!-- PAGE 3 -->
<div id="page3" class="card" style="display:none;">

    <h1 class="title smallTitle">
        May I court you?
    </h1>

    <div class="buttonRow">

        <button
            class="yesBtn"
            onclick="goPage4()">
            Yes
        </button>

        <button
            id="noBtn2"
            class="noBtn"
            onclick="pressNo2()">
            No
        </button>

    </div>

    <p id="sadText2" class="message"></p>

</div>

<!-- PAGE 4 -->
<div id="page4" class="card" style="display:none;">

    <h1 class="title smallTitle">
        Yayyy. Please read this, baby ❤️
    </h1>

    <div class="letterContainer">

        <!-- Paste your entire letter here -->

        <p>
            Hi baby ^^ I want to say thank you...
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
